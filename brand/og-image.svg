<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="*Space — an inclusive digital coworking space on Discord">
	<title>*Space</title>
	<!--
		Share-card SOURCE. 1200x630 is the 1.91:1 every platform crops toward.

		`{{MARK}}` is replaced with brand/starspace-mark.png as a data URI by
		scripts/build-brand.mjs, which then renders static/og-image.png — the file
		that actually ships, because no scraper fetches an SVG og:image. Edit the
		wording here and re-run `bun run build:brand`.

		The starfield is seeded (20260904), so a rebuild is not a binary diff for
		its own sake.
	-->
	<defs>
		<radialGradient id="sky" cx="30%" cy="35%" r="85%">
			<stop offset="0" stop-color="#1b2450" />
			<stop offset="1" stop-color="#070c1f" />
		</radialGradient>
		<radialGradient id="nebula" cx="50%" cy="50%" r="50%">
			<stop offset="0" stop-color="#fe795d" stop-opacity="0.30" />
			<stop offset="1" stop-color="#fe795d" stop-opacity="0" />
		</radialGradient>
	</defs>

	<rect width="1200" height="630" fill="url(#sky)" />
	<ellipse cx="300" cy="300" rx="460" ry="360" fill="url(#nebula)" />

