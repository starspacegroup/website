<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="*Space">
	<title>*Space</title>
	<!--
		The same mark on a light tile. The bronze is stepped darker than the dark
		tile's (#c97c3e against #e0a063) because it now has to hold against
		white rather than navy.
	-->
	<defs>
		<linearGradient id="light-tile" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#ffffff" />
			<stop offset="1" stop-color="#fff1ec" />
		</linearGradient>
	</defs>
	<rect width="512" height="512" rx="104" fill="url(#light-tile)" />
	<rect x="16" y="16" width="480" height="480" rx="90" fill="none" stroke="#ffd5cc" stroke-width="12" />
	<g transform="translate(0 26) translate(256 256) scale(0.82) translate(-256 -256)">
		<path
			d="M256,30 L309,178 L466,183 L342,279 L386,430 L256,342 L126,430 L170,279 L46,183 L203,178 Z"
			fill="#c97c3e"
		/>
		<path d="M256,74 L347,346 L165,346 Z" fill="#492415" />
	</g>
</svg>
